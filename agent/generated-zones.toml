system = "JMCP"
version = 1

[policy]
default = "manual"
generated_content_must_be_reproducible = true
generated_content_requires_marker = true

[[protected_zones]]
exception = "docs/generated/**"
path = "docs/**"
rule = "Human-authored documentation by default."

[[protected_zones]]
path = "paper/*.tex"
rule = "Final paper source is manually governed."

[[zone]]
allowed = true
command = "just contract-drift"
kind = "event-contract"
path = "contracts/events/jcp-envelope.schema.json"
required_marker = "Generated by: just contract-drift. Source: schemas/jcp/1.0.0/jcp.schema.json. DO NOT EDIT BY HAND."
source = "schemas/jcp/1.0.0/jcp.schema.json -> contracts/events/jcp-envelope.schema.json"

[[zone]]
allowed = true
command = "just contract-drift"
kind = "http-contract"
path = "contracts/openapi/jmcp-api.openapi.yaml"
required_marker = "Contract zone: verified by just contract-drift. Source: crates/jmcp-api/src/routes.rs + jmcp-domain/jcp-core serde types. DO NOT EDIT WITHOUT ROUTE COVERAGE."
source = "crates/jmcp-api/src/routes.rs + crates/jmcp-domain serde types + crates/jcp-core serde types -> contracts/openapi/jmcp-api.openapi.yaml"

[[zone]]
allowed = true
command = "just contract-drift"
kind = "stream-contract"
path = "contracts/asyncapi/jmcp-streams.asyncapi.yaml"
required_marker = "Contract zone: verified by just contract-drift. Source: jmcp-api streaming routes + jmcp-domain serde types. DO NOT EDIT WITHOUT ROUTE COVERAGE."
source = "crates/jmcp-api/src/jitux.rs + crates/jmcp-api/src/routes_toolplane.rs + crates/jmcp-api/src/routes_runtime.rs + crates/jmcp-domain serde types -> contracts/asyncapi/jmcp-streams.asyncapi.yaml"
